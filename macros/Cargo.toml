[package]
name = "mlirpass-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for mlirpass: #[pass], #[patterns] / #[lowering]"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirpass"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
