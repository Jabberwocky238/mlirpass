name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: mlirpass
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mlirpass
      - run: cargo build --all-targets
        working-directory: mlirpass
      - run: cargo test -p mlirpass
        working-directory: mlirpass
      - run: cargo build -p mlirpass --no-default-features
        working-directory: mlirpass
