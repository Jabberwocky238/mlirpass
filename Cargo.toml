[package]
name = "mlirpass"
version = "0.10.4"
edition = "2024"
description = "MLIR passes in Rust: mutable IR, pattern rewriting, dialect conversion and the upstream lowerings, on top of mlirformat"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirpass"
readme = "README.md"
keywords = ["mlir", "compiler", "ir", "pass", "lowering"]
categories = ["compilers", "no-std"]
# The mlir-opt fixtures stay in the repository.
exclude = ["tests", "fuzz", "data", "tools"]

[workspace]
members = ["macros", "tools/*"]
# Random IR against mlir-opt, and timings: a crate of its own (`fuzz/README.md`).
exclude = ["fuzz"]

[dependencies]
mlirpass-macros = { path = "macros", version = "0.5.0" }
mlirformat = { git = "https://github.com/Jabberwocky238/mlirformat.git", tag = "0.8.1", version = "0.8.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
# f64 trunc / ldexp / rint without std (all exact).
libm = "0.2"
# An op's operands, results, successors and regions, a block's arguments, a value's uses: a few
# inline, no allocation each (`ir::Ids`).
smallvec = { version = "1.15", default-features = false, features = ["union", "const_generics"] }
# What runs tasks: a pipeline runs on any `moremath::Executor` (`ThreadMulti` by default), the kind
# mlirformat's `parse_in` / `print_in` take too.
moremath = { version = "0.2.1", default-features = false, features = ["alloc"] }

[features]
default = ["std", "cli", "all-dialects", "all-targets"]
std = ["mlirformat/std", "moremath/std", "serde/std", "thiserror/std"]
# The `mlirpass` command line (`cargo install mlirpass`).
cli = ["std"]
# One feature per dialect: its op interfaces, folds, canonicalization patterns, its own
# transforms and its lowerings to other dialects (`dialect.scf`). A lowering into a backend
# also needs that `target.*`.
all-dialects = ["dialect.acc", "dialect.affine", "dialect.amdgpu", "dialect.arith", "dialect.bufferization", "dialect.cf", "dialect.complex", "dialect.emitc", "dialect.func", "dialect.gpu", "dialect.index", "dialect.linalg", "dialect.llvm", "dialect.math", "dialect.memref", "dialect.ml_program", "dialect.mpi", "dialect.nvgpu", "dialect.nvvm", "dialect.omp", "dialect.ptr", "dialect.quant", "dialect.scf", "dialect.shape", "dialect.sparse_tensor", "dialect.spirv", "dialect.tensor", "dialect.test", "dialect.tosa", "dialect.ub", "dialect.vector", "dialect.x86", "dialect.xegpu", "dialect.xevm"]
"dialect.acc" = []
"dialect.affine" = ["dialect.arith"]
"dialect.amdgpu" = ["dialect.memref"]
"dialect.arith" = []
"dialect.bufferization" = ["dialect.memref"]
"dialect.cf" = []
"dialect.complex" = ["dialect.arith"]
"dialect.emitc" = []
"dialect.func" = []
"dialect.gpu" = ["dialect.arith", "dialect.memref"]
"dialect.index" = ["dialect.arith"]
"dialect.linalg" = ["dialect.arith", "dialect.affine", "dialect.memref", "dialect.tensor"]
"dialect.llvm" = []
"dialect.math" = ["dialect.arith", "dialect.vector"]
"dialect.memref" = ["dialect.arith", "dialect.affine"]
"dialect.ml_program" = []
"dialect.mpi" = ["dialect.arith"]
"dialect.nvgpu" = ["dialect.nvvm", "dialect.memref", "dialect.scf", "dialect.arith"]
"dialect.nvvm" = []
"dialect.omp" = []
"dialect.ptr" = []
"dialect.quant" = []
"dialect.scf" = []
"dialect.shape" = ["dialect.arith"]
"dialect.sparse_tensor" = []
"dialect.spirv" = []
"dialect.tensor" = ["dialect.arith", "dialect.affine"]
"dialect.test" = []
"dialect.tosa" = []
"dialect.ub" = []
"dialect.vector" = ["dialect.affine", "dialect.arith", "dialect.memref", "dialect.ub"]
"dialect.x86" = ["dialect.memref"]
"dialect.xegpu" = ["dialect.xevm", "dialect.vector", "dialect.memref", "dialect.arith", "dialect.index", "dialect.scf", "dialect.gpu"]
"dialect.xevm" = []
# The GPU instruction sets mlirpass encodes itself (not upstream dialects; not in `all-dialects`): their ops, types
# and encodings. `target.<isa>` lowers into one and emits its machine code.
"dialect.agx" = ["dialect.image"]
"dialect.apple9" = []
"dialect.rdna2" = ["dialect.image"]
"dialect.xe3" = ["dialect.image"]
# What a GPU runs, for every GPU target: memories, command streams, data; table-driven packing; the layout.
"dialect.image" = []
# One feature per backend (`src/targets`): its type converter, `convert-to-*`, the lowerings
# into it, and what it emits.
all-targets = ["target.llvm", "target.emitc", "target.spirv"]
"target.llvm" = ["dialect.llvm"]
"target.emitc" = ["dialect.emitc"]
"target.spirv" = ["dialect.spirv"]
# The GPUs' own machine code, one feature each (not in `all-targets`): SPIR-V and the upstream dialects ⇒ the
# instruction set ⇒ registers ⇒ bytes (`gpu-module-to-binary`). Apple AGX (G13), Apple9 (M3 / M4), AMD RDNA2 (GFX10.3), Intel Xe3.
"target.apple9" = ["dialect.apple9", "dialect.spirv", "dialect.gpu", "dialect.arith", "dialect.math", "dialect.vector", "dialect.func", "dialect.scf"]
"target.agx" = ["dialect.agx", "dialect.spirv", "dialect.gpu", "dialect.arith", "dialect.math", "dialect.vector", "dialect.func", "dialect.scf"]
"target.rdna2" = ["dialect.rdna2", "dialect.spirv", "dialect.gpu", "dialect.arith", "dialect.math", "dialect.vector", "dialect.func", "dialect.scf"]
"target.x86_64" = ["dialect.llvm"]
"target.xe3" = ["dialect.xe3", "dialect.spirv", "dialect.gpu", "dialect.arith", "dialect.math", "dialect.vector", "dialect.func", "dialect.scf"]

[[bin]]
name = "mlirpass"
path = "src/main.rs"
required-features = ["cli"]

# The fixtures run every dialect's and backend's passes.
[dev-dependencies]
# tests/x86_64.rs maps the machine code executable to run it
libc = "0.2"

[[test]]
name = "x86_64"
required-features = ["target.x86_64"]

[[test]]
name = "passes"
required-features = ["all-dialects", "all-targets"]

[[test]]
name = "asm_names"
required-features = ["all-dialects"]

[[test]]
name = "spirv"
required-features = ["all-dialects", "target.spirv"]

[[test]]
name = "spirv_glsl"
required-features = ["all-dialects", "target.spirv"]

# Each GPU target's encoder against its oracle (llvm-mc, Mesa, gentool).
[[test]]
name = "agx"
required-features = ["dialect.agx"]

[[test]]
name = "apple9"
required-features = ["dialect.apple9"]

[[test]]
name = "rdna2"
required-features = ["dialect.rdna2"]

[[test]]
name = "xe3"
required-features = ["dialect.xe3"]

[[test]]
name = "vulkan"
required-features = ["all-dialects", "target.spirv"]
