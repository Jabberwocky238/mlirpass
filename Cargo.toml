[package]
name = "mlirpass"
version = "0.3.4"
edition = "2024"
description = "MLIR passes in Rust: mutable IR, pattern rewriting, dialect conversion and the upstream lowerings, on top of mlirformat"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirpass"
readme = "README.md"
keywords = ["mlir", "compiler", "ir", "pass", "lowering"]
categories = ["compilers", "no-std"]
# The mlir-opt fixtures stay in the repository.
exclude = ["tests", ".github", "fuzz"]

[workspace]
members = ["macros"]
# Random IR against mlir-opt, and timings: a crate of its own (`fuzz/README.md`).
exclude = ["fuzz"]

[dependencies]
mlirpass-macros = { path = "macros", version = "0.3.0" }
mlirformat = { version = "0.4.7", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
# f64 trunc / ldexp / rint without std (all exact).
libm = "0.2"

[features]
default = ["std", "cli", "llvm", "emitc", "spirv"]
std = ["mlirformat/std", "serde/std", "thiserror/std"]
# The `mlirpass` command line (`cargo install mlirpass`).
cli = ["std"]
# The backends under `src/emits`.
llvm = []
emitc = []
spirv = []

[[bin]]
name = "mlirpass"
path = "src/main.rs"
required-features = ["cli"]

# The fixtures run every backend's passes.
[[test]]
name = "passes"
required-features = ["llvm", "emitc", "spirv"]

[[test]]
name = "spirv"
required-features = ["spirv"]

[[test]]
name = "spirv_glsl"
required-features = ["spirv"]

[[test]]
name = "vulkan"
required-features = ["spirv"]
