[package]
name = "agxgen"
description = "Generates the agx dialect's struct ops (Mesa's asahi genxml) and USC instructions (Mesa's AGX2 model)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
